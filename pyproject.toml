[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akumi"
version = "0.1.0"
description = "Official Python SDK for the Akumi EU-sovereign inference API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# ruff is pinned exactly, on purpose. CI reinstalls this extra on every run and
# then rewrites the generated sources with `ruff check --fix` + `ruff format`.
# The release trigger is "did the generated output change", so an unpinned ruff
# makes someone else's formatter release cut an Akumi release: a new ruff whose
# formatting differs by a byte produces a diff with no input change on our side,
# which auto-commits to the public SDK repo, tags a patch, and publishes to PyPI.
# Pinning keeps a release something we caused. Bump it deliberately.
dev = ["mypy>=1.11", "ruff==0.16.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/akumi"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# The transport's __enter__/__aenter__ return the concrete transport type rather
# than Self, which on Python < 3.11 would pull in typing_extensions just for an
# annotation. PYI034 is a stylistic preference, so ignore it and keep the runtime
# dependency-free. All other lint rules are auto-fixed in CI (ruff check --fix).
ignore = ["PYI034"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
